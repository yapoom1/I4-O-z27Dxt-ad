<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark, rich background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /> <!-- slate-900 -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate-950 -->
    </linearGradient>

    <!-- Vibrant primary gradient -->
    <linearGradient id="primaryGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- blue-500 -->
      <stop offset="50%" stop-color="#6366f1" /> <!-- indigo-500 -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- violet-500 -->
    </linearGradient>

    <!-- Glossy reflection overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base App Icon Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGradient)" filter="url(#softShadow)" />
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#334155" stroke-width="4" opacity="0.5" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#primaryGradient)" stroke-width="12" filter="url(#neonGlow)" opacity="0.4" />

  <!-- Centerpiece: Intersecting Polygons forming an 'A' and 'Data/Box' concept -->
  <g transform="translate(128, 116)">
    <!-- Left Wing -->
    <path d="M128 40 L60 220 L110 220 L150 110 Z" fill="url(#primaryGradient)" />
    <!-- Right Wing -->
    <path d="M128 40 L196 220 L146 220 L106 110 Z" fill="url(#primaryGradient)" opacity="0.8" />
    
    <!-- Central Hex/Cube -->
    <path d="M80 150 L128 120 L176 150 L176 210 L128 240 L80 210 Z" fill="#ffffff" filter="url(#softShadow)" />
    <!-- Inner facet of the cube -->
    <path d="M128 120 L176 150 L128 180 L80 150 Z" fill="#e2e8f0" />
    <path d="M128 180 L176 150 L176 210 L128 240 Z" fill="#94a3b8" />
  </g>

  <!-- Glass overlay for premium 3D feel -->
  <path d="M32 144 C 32 82 82 32 144 32 L368 32 C 430 32 480 82 480 144 L480 256 C 256 200 150 350 32 256 Z" fill="url(#gloss)" opacity="0.3" style="mix-blend-mode: overlay; pointer-events: none;" />
</svg>